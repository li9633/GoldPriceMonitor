<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>黄金持仓建议</title>
  </head>
  <body style="margin:0;padding:24px;background:#f5f1e8;font-family:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;color:#3a3226;">
    <div style="max-width:560px;margin:0 auto;background:#fffdf8;border:1px solid #e8e0d0;border-radius:10px;overflow:hidden;">
      <div style="padding:18px 24px;background:#d4a017;color:#fffdf8;font-size:17px;font-weight:600;">
        黄金持仓建议
      </div>

      <div style="padding:20px 24px;">
        <div style="margin-bottom:6px;">
          <span style="color:#8c7a5c;font-size:13px;">品种</span>
          <span style="font-size:15px;font-weight:600;">{{symbol_name}}</span>
        </div>
        <div style="margin-bottom:6px;">
          <span style="color:#8c7a5c;font-size:13px;">当前价格</span>
          <span style="font-size:20px;font-weight:700;">¥{{price}} /克</span>
        </div>
        {{london_gold_info}}

        <div style="margin:16px 0;padding:14px 16px;background:#faf6ec;border-radius:8px;">
          <div style="margin-bottom:8px;">
            <span style="color:#8c7a5c;font-size:13px;">建议动作</span>
            <span style="font-size:17px;font-weight:700;color:{{action_color}};">{{action_label}}</span>
          </div>
          <div style="margin-bottom:6px;font-size:14px;">
            <span style="color:#8c7a5c;">建议数量：</span>{{target_grams}}
          </div>
          <div style="margin-bottom:6px;font-size:14px;">
            <span style="color:#8c7a5c;">建议价位：</span>{{price_band}}
          </div>
          <div style="font-size:14px;">
            <span style="color:#8c7a5c;">持仓状态：</span>{{position_info}}
          </div>
          {{valuation_note}}
        </div>

        <div style="font-size:14px;font-weight:600;color:#8c7a5c;margin-bottom:8px;">判断依据</div>
        <div style="font-size:13px;line-height:1.7;margin-bottom:18px;">{{signals}}</div>

        <div style="font-size:14px;font-weight:600;color:#8c7a5c;margin-bottom:8px;">说明</div>
        <div style="font-size:14px;line-height:1.8;">{{rationale}}</div>

        <div style="margin-top:18px;color:#8c7a5c;font-size:12px;">生成时间：{{time}}</div>
        {{debug_notice}}
        {{model_info}}
      </div>

      <div style="padding:14px 24px;background:#faf6ec;color:#8c7a5c;font-size:12px;line-height:1.6;border-top:1px solid #e8e0d0;">
        建议由规则计算生成，仅供参考，不构成投资建议。<br />
        黄金价格监控系统 © {{year}}
      </div>
    </div>
  </body>
</html>
